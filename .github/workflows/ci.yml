# Testes e build a cada push. Nenhum teste baixa modelo nem toca audio real:
# as suites usam stubs de torch/pyannote onde o modelo seria carregado, e
# audio sintetico (ffmpeg lavfi) onde precisam de um arquivo.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Dependencias (torch so de CPU)
        # torch e torchaudio do MESMO indice de CPU: so o torch daqui, e o
        # pyannote puxa um torchaudio do PyPI compilado para CUDA, que nao
        # carrega sem libcudart.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint e formatacao
        run: |
          ruff check .
          ruff format --check .
      - name: Suites (cada arquivo sozinho, como no dia a dia)
        # Lista o nome e o erro de todo teste que falhar, nunca so o total.
        run: python tests/rodar.py
      - name: Suites com pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build

  # Ponta a ponta num Chromium sem janela, so com os dados de demonstracao
  # (frontend/e2e/ponta-a-ponta.mjs): navegacao, revisao e apagar reuniao,
  # pelo proxy do Vite - qualquer 403/5xx reprova. O servidor sobe sem
  # torch nem pyannote (so os importa ao processar audio), entao o job
  # instala so o que ele precisa, e roda em paralelo aos outros dois.
  ponta-a-ponta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Dependencias do servidor (sem torch)
        run: |
          python -m pip install --upgrade pip
          pip install numpy fastapi "uvicorn[standard]" python-multipart
          pip install --no-deps -e .
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
