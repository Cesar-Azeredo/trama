<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trama</title>
    <script>
      // Aplica o tema ANTES do React montar, senao um sistema escuro
      // pisca claro por um instante. Mesma logica de src/tema/useTema.ts.
      (function () {
        try {
          var salvo = localStorage.getItem("rec-meet:tema");
          var tema =
            salvo === "claro" || salvo === "escuro"
              ? salvo
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "escuro"
                : "claro";
          document.documentElement.setAttribute("data-tema", tema);
        } catch (e) {
          // localStorage bloqueado - fica no claro (o :root padrao) ate o React montar.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
